[pytest]
testpaths = testcases
python_files = test_*.py
addopts = -q --strict-markers --timeout=60
markers =
    db: 需要本地 MySQL(shop_test) 与 db_app.py(8010)
    smoke: 核心冒烟用例，必须 30 秒内跑完（提交前跑这个）
    network: 依赖公网服务，可能 flaky（CI 里排除）
    local: 依赖本地 mock 服务（server.py / idem_server.py）
    api: 接口测试
    booking: booking预订业务
