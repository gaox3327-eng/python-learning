error_matrix:
  - id: ok_normal
    desc: 正常查询
    params: { limit: 3}
    expected_status: 200

  - id: limit-negative
    desc: limit 为负数
    params: { limit: -1 }
    expected_status: 400

  - id: limit-not-number
    desc: limit 传字符串
    params: { limit: "abc" }
    expected_status: 400

  - id: limit-zero
    desc: limit=0 应拒绝
    params: { limit: 0 }
    expected_status: 400
    known_defect: true          # ← 缺陷：实际返回 200 全量

  - id: limit-float
    desc: limit 传小数
    params: { limit: 0.5 }
    expected_status: 400
    known_defect: true          # ← 缺陷：实际返回 200 全量

  - id: order-invalid
    desc: order 不是 asc/desc
    params: { sortBy: price, order: hhh }
    expected_status: 400

  - id: skip-negative
    desc: skip 为负数
    params: { skip: -1 }
    expected_status: 400  

  - id: limit_max_valid
    desc: limit 等于合法上限（边界合法）
    params: { limit: 100 }
    expected_status: 200

  - id: resource_not_exist
    desc: 查询不存在的商品id
    path: /products/99999
    expected_status: 404

  - id: wrong_http_method
    desc: "缺陷: 对 /products 用 PUT，返回 404+HTML 而非 405"
    method: PUT
    path: /products
    expected_status: 405
    known_defect: true

  - id: wrong_path
    desc: 现状：访问不存在的路径，返回 404 + HTML 错误页
    path: /productsx
    expected_status: 404
    expected_content_type: text/html


