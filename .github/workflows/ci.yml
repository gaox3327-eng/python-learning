name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: week11/day5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: week11/day5/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 跑测试（排除公网 flaky 用例）
        run: pytest -m "smoke or local" --junitxml=junit.xml --html=report.html --self-contained-html

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: |
            week11/day5/report.html
            week11/day5/junit.xml
